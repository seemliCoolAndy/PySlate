<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">迭代器：保存位置，逐项前进</title><desc id="desc">列表可再创建迭代器；同一个迭代器不会自动倒带。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="580" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">迭代器：保存位置，逐项前进</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">列表可再创建迭代器；同一个迭代器不会自动倒带。</text><rect x="60" y="127" width="640" height="65" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="169.73" font-size="31" font-weight="400" text-anchor="middle" fill="#253d32">values = [10, 20]</text><path d="M380 204L380 240" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><text x="470" y="231" font-size="25" font-weight="400" text-anchor="start" fill="#253d32">iter(values)</text><rect x="38" y="263" width="217" height="123" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="146.5" y="313.74" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">第 1 次 next</text><text x="146.5" y="353.74" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">10</text><path d="M258 324L278 324" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="282" y="263" width="217" height="123" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="390.5" y="313.74" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">第 2 次 next</text><text x="390.5" y="353.74" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">20</text><path d="M502 324L522 324" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="526" y="263" width="217" height="123" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="634.5" y="313.74" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">第 3 次 next</text><text x="634.5" y="353.74" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">默认值</text><text x="380" y="425" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">next(cursor, &quot;已经结束&quot;) → &quot;已经结束&quot;</text><rect x="73" y="460" width="614" height="62" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="499.58" font-size="26" font-weight="400" text-anchor="middle" fill="#253d32">next(iter(values)) → 新迭代器又从 10 开始</text><text x="380" y="562" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">没有默认值时，耗尽后的 next 会抛 StopIteration。</text></g></svg>