<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title desc"><title id="title">成绩统计：整批验证通过后，才开始计算</title><desc id="desc">示例记录：小禾:80,阿青:100,小林:50</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="570" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">成绩统计：整批验证通过后，才开始计算</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">示例记录：小禾:80,阿青:100,小林:50</text><rect x="30" y="122" width="700" height="78" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="156" font-size="24" text-anchor="start" fill="#253e32">按逗号拆记录 → 按冒号拆姓名、分数</text><text x="50" y="188" font-size="22" text-anchor="start" fill="#5e7165">分数转 int；姓名去掉首尾空白</text><path d="M210 207V237" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="250" width="330" height="170" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="287" font-size="25" text-anchor="start" fill="#253e32">必须全部满足</text><text x="50" y="328" font-size="23" text-anchor="start" fill="#253e32">姓名非空，而且不重复</text><text x="50" y="367" font-size="23" text-anchor="start" fill="#253e32">分数是 0～100 的整数</text><text x="50" y="404" font-size="23" text-anchor="start" fill="#253e32">至少有一条记录</text><path d="M370 330H403" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="415" y="250" width="315" height="170" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="435" y="287" font-size="25" text-anchor="start" fill="#253e32">合法字典 records</text><text x="435" y="329" font-size="24" text-anchor="start" fill="#253e32">小禾 → 80</text><text x="435" y="367" font-size="24" text-anchor="start" fill="#253e32">阿青 → 100</text><text x="435" y="405" font-size="24" text-anchor="start" fill="#253e32">小林 → 50</text><rect x="30" y="454" width="700" height="75" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="486" font-size="25" text-anchor="start" fill="#253e32">人数 3    平均 76.7    最高 100</text><text x="50" y="519" font-size="23" text-anchor="start" fill="#253e32">及格人数 2：逐项判断 score &gt;= 60 后累计</text><text x="30" y="561" font-size="22" text-anchor="start" fill="#5e7165">任一记录不合法 → 整批拒绝，不把坏数据当成 0 分。</text></g></svg>