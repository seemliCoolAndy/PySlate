<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title description"><title id="title">集合：重叠表示共同成员</title><desc id="description">维恩图把数学、Python、写作放入精确成员区域并给出交集和差集；read成员为Python与数学，wanted为Python与写作；交集只含Python；wanted减read只含写作；图上位置不表示集合排序</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="600" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">集合：重叠表示共同成员</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">已读中的两个 Python 只保留一个成员。</text><text x="250" y="125" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">已读 read</text><text x="510" y="125" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">愿望 wanted</text><circle cx="270" cy="285" r="155" fill="#e2ecdf" fill-opacity="0.75" stroke="#3a745c" stroke-width="2"/><circle cx="490" cy="285" r="155" fill="#e6bf83" fill-opacity="0.5" stroke="#a7834c" stroke-width="2"/><text x="225" y="292" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">数学</text><text x="380" y="292" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">Python</text><text x="535" y="292" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">写作</text><text x="35" y="478" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">read &amp; wanted → {&quot;Python&quot;}</text><text x="35" y="523" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">wanted - read → {&quot;写作&quot;}</text><text x="380" y="577" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">重复只记一次；圆中位置不代表集合有固定顺序。</text></svg>