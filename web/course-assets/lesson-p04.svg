<svg xmlns="http://www.w3.org/2000/svg" width="760" height="630" viewBox="0 0 760 630" role="img" aria-labelledby="title desc"><title id="title">待办清单：内存中的变更，及时保存到 JSON</title><desc id="desc">稳定 id 标识任务；列表位置变化时，不给其他任务改编号。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="630" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">待办清单：内存中的变更，及时保存到 JSON</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">稳定 id 标识任务；列表位置变化时，不给其他任务改编号。</text><rect x="30" y="123" width="300" height="113" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="161" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">project_todos.json</text><text x="50" y="199" font-size="24" text-anchor="start" fill="#253e32">启动：读取并验证</text><text x="50" y="229" font-size="22" text-anchor="start" fill="#253e32">无文件 → 新列表</text><path d="M340 179H393" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="405" y="123" width="325" height="113" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="425" y="161" font-size="26" text-anchor="start" fill="#253e32">内存 tasks</text><text x="425" y="199" font-size="23" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">id: 1  title: &quot;阅读&quot;</text><text x="425" y="229" font-size="23" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">done: false</text><path d="M570 243V280" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="405" y="293" width="325" height="119" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="425" y="333" font-size="24" text-anchor="start" fill="#253e32">add 标题 / done 编号</text><text x="425" y="370" font-size="24" text-anchor="start" fill="#253e32">变更后 → save_tasks</text><text x="425" y="402" font-size="22" text-anchor="start" fill="#253e32">list：只显示，不修改</text><path d="M395 353H340" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="293" width="300" height="119" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="333" font-size="24" text-anchor="start" fill="#253e32">同目录 .tmp 文件</text><text x="50" y="370" font-size="23" text-anchor="start" fill="#253e32">写完 → replace 原文件</text><text x="50" y="402" font-size="22" text-anchor="start" fill="#253e32">降低写到一半的风险</text><path d="M180 286V244" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="456" width="700" height="86" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="493" font-size="25" text-anchor="start" fill="#253e32">第一次：add 阅读 → quit</text><text x="50" y="529" font-size="24" text-anchor="start" fill="#253e32">第二次：list → 仍看到 1 [ ] 阅读</text><text x="30" y="581" font-size="23" text-anchor="start" fill="#253e32">损坏文件：提示并停止，不覆盖原文件。</text><text x="30" y="617" font-size="22" text-anchor="start" fill="#5e7165">next_id 从现存最大编号 + 1 续接；不是永久身份系统。</text></g></svg>