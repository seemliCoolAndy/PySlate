<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">collections：按任务选择容器</title><desc id="desc">三种任务，三种专门的数据结构。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="610" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">collections：按任务选择容器</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">三种任务，三种专门的数据结构。</text><text x="36" y="145" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">Counter：计数</text><rect x="36" y="166" width="240" height="70" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="156.0" y="210.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">书 · 笔 · 书</text><path d="M289 201L350 201" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="166" width="355" height="70" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="542.5" y="210.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">书：2     笔：1</text><text x="36" y="296" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">defaultdict(list)：分组</text><rect x="36" y="318" width="240" height="78" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="156.0" y="346.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">类别 → 姓名</text><text x="156.0" y="383.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">读书 / 跑步</text><path d="M289 357L350 357" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="309" width="355" height="98" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="542.5" y="347.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">读书：[小禾, 小川]</text><text x="542.5" y="384.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">跑步：[阿青]</text><text x="36" y="461" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">deque：先进先出</text><rect x="36" y="483" width="120" height="66" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="96.0" y="524.91" font-size="27" font-weight="400" text-anchor="middle" fill="#253d32">取出 A</text><path d="M242 516L170 516" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="255" y="483" width="100" height="66" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="305.0" y="526.56" font-size="32" font-weight="400" text-anchor="middle" fill="#253d32">A</text><rect x="368" y="483" width="100" height="66" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="418.0" y="526.56" font-size="32" font-weight="400" text-anchor="middle" fill="#253d32">B</text><path d="M488 516L547 516" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="483" width="160" height="66" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="640.0" y="524.91" font-size="27" font-weight="400" text-anchor="middle" fill="#253d32">剩下 [B]</text><text x="380" y="593" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">popleft() 从左侧取出；未知键的 [] 访问会创建分组。</text></g></svg>