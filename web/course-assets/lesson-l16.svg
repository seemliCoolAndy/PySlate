<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title description"><title id="title">调试：先写预期，再逐轮比较状态</title><desc id="description">独立手算累计表对照错误赋值的首次偏离，展示定位而不是猜改；正确更新前0,1,3，更新后1,3,6；错误total=number得到1,2,3；首次不同在第二轮，非直到最终输出才发现</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="590" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">调试：先写预期，再逐轮比较状态</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">正确累计 1、2、3 时，状态应依次变成 1、3、6。</text><rect x="35" y="112" width="690" height="56" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="380.0" y="148.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">正确更新：total = total + number</text><text x="95" y="214" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">number</text><text x="290" y="214" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">更新前 total</text><text x="485" y="214" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">更新后 total</text><text x="665" y="214" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">预期</text><rect x="35" y="235" width="690" height="53" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="95" y="271" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">1</text><text x="290" y="271" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">0</text><text x="485" y="271" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">1</text><text x="665" y="271" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">1</text><rect x="35" y="296" width="690" height="53" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="95" y="332" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">2</text><text x="290" y="332" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">1</text><text x="485" y="332" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">3</text><text x="665" y="332" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">3</text><rect x="35" y="357" width="690" height="53" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="95" y="393" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">3</text><text x="290" y="393" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">3</text><text x="485" y="393" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">6</text><text x="665" y="393" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">6</text><text x="35" y="465" fill="#935947" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">若误写 total = number</text><text x="50" y="516" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">预期：1 → 3 → 6</text><text x="395" y="516" fill="#935947" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">实际：1 → 2 → 3</text><text x="380" y="565" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">第 2 轮首次偏离；回看赋值，而非只改最后输出。</text></svg>