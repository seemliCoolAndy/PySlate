<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title description"><title id="title">同样的 12，类型决定运算含义</title><desc id="description">并排对照字符串连接与整数乘法，并标出不合法整数文本；raw加raw得到1212字符串；int转换后count乘2得到24；int文本3.5产生ValueError而非自动截断</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="570" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">同样的 12，类型决定运算含义</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">先读取文本，再按约定转换，最后参与数值计算。</text><rect x="35" y="127" width="230" height="70" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="150.0" y="170.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">raw = &quot;12&quot;</text><text x="150" y="239" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">str：文本</text><path d="M275 163 L350 163" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="370" y="127" width="350" height="70" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="545.0" y="170.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">raw + raw → &quot;1212&quot;</text><path d="M150 255 L150 303" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><text x="225" y="288" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">int(raw)</text><rect x="35" y="321" width="230" height="70" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="150.0" y="364.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">count = 12</text><text x="150" y="433" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">int：整数</text><path d="M275 356 L350 356" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="370" y="321" width="350" height="70" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="545.0" y="364.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">count * 2 → 24</text><rect x="35" y="474" width="690" height="65" rx="12" fill="#efddd2" stroke="#b6cbb3" stroke-width="2"/><text x="380" y="516" fill="#935947" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">int(&quot;3.5&quot;) → ValueError：不是整数格式</text></svg>