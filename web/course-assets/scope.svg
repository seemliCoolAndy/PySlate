<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img"><title>作用域：函数有自己的局部名称</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker></defs><rect width="760" height="430" rx="18" fill="#f7f8f4"/><text x="35" y="48" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" fill="#253d32" text-anchor="start">作用域：函数有自己的局部名称</text><text x="35" y="82" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#647a6b" text-anchor="start">读取名称会向外查找；函数内赋值通常创建局部名称。</text><rect x="40" y="115" width="680" height="280" rx="15" fill="#e2ecdf" stroke="#b6cbb3"/><text x="65" y="154" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" fill="#253d32" text-anchor="start">模块作用域：x = 10</text><rect x="80" y="185" width="580" height="145" rx="13" fill="#f7f8f4" stroke="#9bb795"/><text x="105" y="224" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" fill="#253d32" text-anchor="start">函数作用域：x = 3</text><text x="105" y="277" font-family="Consolas,monospace" font-size="24" fill="#253d32" text-anchor="start">函数里 print(x) → 3</text><text x="65" y="370" font-family="Consolas,monospace" font-size="24" fill="#253d32" text-anchor="start">函数外 print(x) → 10</text></svg>