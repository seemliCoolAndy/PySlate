<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">文本分析：先定义统计口径，再看词频</title><desc id="desc">样本：两行英文，加一行空行；按空白分词，清除首尾有限标点。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="650" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">文本分析：先定义统计口径，再看词频</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">样本：两行英文，加一行空行；按空白分词，清除首尾有限标点。</text><rect x="30" y="121" width="700" height="105" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="159" font-size="25" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">Python makes small tools.</text><text x="50" y="194" font-size="25" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">Small tools save time.</text><text x="494" y="213" font-size="22" text-anchor="start" fill="#5e7165">第 3 行为空行</text><path d="M380 233V265" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="278" width="700" height="71" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="308" font-size="24" text-anchor="start" fill="#253e32">lower → split → strip 首尾标点 → 去空词</text><text x="50" y="338" font-size="23" text-anchor="start" fill="#253e32">Small / small 归为同一个词：small</text><path d="M190 355V388" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M570 355V388" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="401" width="320" height="182" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="440" font-size="25" text-anchor="start" fill="#253e32">行与单词统计</text><text x="50" y="478" font-size="24" text-anchor="start" fill="#253e32">总行数 3 · 非空行 2</text><text x="50" y="518" font-size="24" text-anchor="start" fill="#253e32">单词数 8 · 不同词 6</text><text x="50" y="558" font-size="22" text-anchor="start" fill="#253e32">末尾换行不额外增行</text><rect x="380" y="401" width="350" height="182" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="400" y="440" font-size="25" text-anchor="start" fill="#253e32">Counter → 稳定前三名</text><text x="400" y="478" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">small  2</text><text x="400" y="518" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">tools  2</text><text x="400" y="558" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">makes  1</text><text x="30" y="611" font-size="23" text-anchor="start" fill="#253e32">排序键 (-次数, 单词)：次数相同就按字母序。</text><text x="30" y="641" font-size="22" text-anchor="start" fill="#5e7165">本版面向简单英文文本，不代表完整中文分词。</text></g></svg>