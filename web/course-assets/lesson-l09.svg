<svg xmlns="http://www.w3.org/2000/svg" width="760" height="595" viewBox="0 0 760 595" role="img" aria-labelledby="title description"><title id="title">短路求值：左边已决定，就不算右边</title><desc id="description">展示and的共同成立和count为零时保护除法的短路路径；年龄条件与有票条件均为True时and为True；count为0使count&gt;0为False；右侧除法不执行，不触发ZeroDivisionError</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="595" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">短路求值：左边已决定，就不算右边</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">and 左边为假时停止；or 左边为真时停止。</text><text x="35" y="128" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="start">两个条件都成立，and 才成立</text><rect x="40" y="151" width="265" height="64" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="172.5" y="191.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">age &gt;= 12 → True</text><rect x="445" y="151" width="275" height="64" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="582.5" y="191.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">has_ticket → True</text><text x="375" y="194" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">and</text><path d="M170 225V251H375M585 225V251H375" fill="none" stroke="#3a745c" stroke-width="3"/><path d="M375 251 L375 276" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="270" y="287" width="210" height="60" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="375.0" y="325.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">True</text><text x="35" y="400" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="start">count = 0 时，从左到右计算</text><rect x="35" y="424" width="295" height="64" rx="12" fill="#efddd2" stroke="#b6cbb3" stroke-width="2"/><text x="182.5" y="464.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">count &gt; 0 → False</text><path d="M340 456 L425 456" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="440" y="424" width="275" height="64" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="577.5" y="464.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">最终为 False</text><rect x="35" y="520" width="690" height="52" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2" stroke-dasharray="7 5"/><text x="380" y="555" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">跳过右侧 total / count；因此不会发生除零。</text></svg>