<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc"><title id="title">CSV 销售分析：坏行报告与有效金额一起交付</title><desc id="desc">csv 负责字段引用；Decimal 负责十进制金额计算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="640" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">CSV 销售分析：坏行报告与有效金额一起交付</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">csv 负责字段引用；Decimal 负责十进制金额计算。</text><rect x="30" y="120" width="700" height="226" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="156" font-size="23" text-anchor="start" fill="#253e32">行号</text><text x="130" y="156" font-size="23" text-anchor="start" fill="#253e32">商品</text><text x="300" y="156" font-size="23" text-anchor="start" fill="#253e32">类别</text><text x="430" y="156" font-size="23" text-anchor="start" fill="#253e32">数量 × 单价</text><path d="M48 170L712 170" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="207" font-size="23" text-anchor="start" fill="#253e32">2</text><text x="130" y="207" font-size="23" text-anchor="start" fill="#253e32">书,合集</text><text x="300" y="207" font-size="23" text-anchor="start" fill="#253e32">学习</text><text x="430" y="207" font-size="22" text-anchor="start" fill="#253e32">2 × 15.00 = 30.00</text><text x="50" y="246" font-size="23" text-anchor="start" fill="#253e32">3</text><text x="130" y="246" font-size="23" text-anchor="start" fill="#253e32">笔</text><text x="300" y="246" font-size="23" text-anchor="start" fill="#253e32">文具</text><text x="430" y="246" font-size="22" text-anchor="start" fill="#253e32">3 × 2.00 = 6.00</text><text x="50" y="285" font-size="23" text-anchor="start" fill="#253e32">4</text><text x="130" y="285" font-size="23" text-anchor="start" fill="#253e32">练习册</text><text x="300" y="285" font-size="23" text-anchor="start" fill="#253e32">学习</text><text x="430" y="285" font-size="22" text-anchor="start" fill="#253e32">1 × 8.00 = 8.00</text><text x="50" y="324" font-size="23" text-anchor="start" fill="#253e32">5</text><text x="130" y="324" font-size="23" text-anchor="start" fill="#253e32">橡皮</text><text x="300" y="324" font-size="23" text-anchor="start" fill="#253e32">文具</text><text x="430" y="324" font-size="22" text-anchor="start" fill="#253e32">2 × oops → 坏行</text><path d="M215 352V388" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M570 352V388" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="401" width="335" height="127" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="438" font-size="25" text-anchor="start" fill="#253e32">逐行验证</text><text x="50" y="477" font-size="23" text-anchor="start" fill="#253e32">数量非负 · 价格有限非负</text><text x="50" y="513" font-size="23" text-anchor="start" fill="#253e32">类别非空 · 列结构正确</text><rect x="395" y="401" width="335" height="127" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="415" y="438" font-size="25" text-anchor="start" fill="#253e32">第 5 行：记录并跳过</text><text x="415" y="477" font-size="24" text-anchor="start" fill="#253e32">有效记录：3</text><text x="415" y="513" font-size="24" text-anchor="start" fill="#253e32">跳过行：[5]</text><rect x="30" y="561" width="700" height="55" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="597" font-size="25" text-anchor="start" fill="#253e32">学习 38.00  +  文具 6.00  =  合计 44.00</text></g></svg>