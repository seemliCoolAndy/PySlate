<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img"><title>异常处理：只在发生异常时进入 except</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker></defs><rect width="760" height="465" rx="18" fill="#f7f8f4"/><text x="35" y="48" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" fill="#253d32" text-anchor="start">异常处理：只在发生异常时进入 except</text><text x="35" y="82" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#647a6b" text-anchor="start">无异常时直接继续；有匹配异常时执行处理代码。</text><rect x="250" y="115" width="260" height="60" rx="13" fill="#e6bf83" stroke="#b6cbb3"/><text x="380.0" y="153.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">try：执行代码</text><path d="M250 145 L145 145" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="170" y="128" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">有匹配异常</text><path d="M510 145 L620 145" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="571" y="128" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">无异常</text><rect x="35" y="200" width="260" height="65" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="165.0" y="240.5" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">except：处理异常</text><path d="M145 145V190" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M620 145V310H380M165 265V310H380" stroke="#3a745c" stroke-width="3" fill="none"/><path d="M380 310 L380 340" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="245" y="345" width="270" height="60" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="380.0" y="383.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">继续后面的代码</text><text x="380" y="435" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="19" fill="#253d32" text-anchor="middle">未匹配的异常继续向外传播；此图未展开 else / finally。</text></svg>