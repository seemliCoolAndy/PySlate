<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">同一个文件：先写入，再追加，最后读取</title><desc id="desc">lesson_note.txt 位于项目工作目录，统一使用 UTF-8。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="520" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">同一个文件：先写入，再追加，最后读取</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">lesson_note.txt 位于项目工作目录，统一使用 UTF-8。</text><rect x="30" y="123" width="213" height="235" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="49" y="162" font-size="25" text-anchor="start" fill="#253e32">1  &quot;w&quot; 写入</text><text x="49" y="209" font-size="22" text-anchor="start" fill="#253e32">先清空已有内容</text><path d="M48 228L224 228" stroke="#b9cbb6" stroke-width="1.5"/><text x="49" y="272" font-size="23" text-anchor="start" fill="#253e32">第一天：变量</text><text x="49" y="319" font-size="22" text-anchor="start" fill="#5e7165">末尾含换行</text><path d="M249 241H267" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="275" y="123" width="213" height="235" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="294" y="162" font-size="25" text-anchor="start" fill="#253e32">2  &quot;a&quot; 追加</text><text x="294" y="209" font-size="22" text-anchor="start" fill="#253e32">保留原有内容</text><path d="M293 228L469 228" stroke="#b9cbb6" stroke-width="1.5"/><text x="294" y="272" font-size="23" text-anchor="start" fill="#253e32">第一天：变量</text><text x="294" y="316" font-size="23" text-anchor="start" fill="#253e32">第二天：循环</text><path d="M494 241H512" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="520" y="123" width="210" height="235" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="539" y="162" font-size="25" text-anchor="start" fill="#253e32">3  &quot;r&quot; 读取</text><text x="539" y="209" font-size="23" text-anchor="start" fill="#253e32">读入 text</text><path d="M538 228L711 228" stroke="#b9cbb6" stroke-width="1.5"/><text x="539" y="272" font-size="23" text-anchor="start" fill="#253e32">第一天：变量</text><text x="539" y="316" font-size="23" text-anchor="start" fill="#253e32">第二天：循环</text><rect x="30" y="389" width="700" height="66" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="430" font-size="24" text-anchor="start" fill="#253e32">每段 with 结束 → 自动关闭该文件对象</text><text x="30" y="491" font-size="23" text-anchor="start" fill="#253e32">print(text, end=&quot;&quot;)：不再额外添加一次换行。</text></g></svg>