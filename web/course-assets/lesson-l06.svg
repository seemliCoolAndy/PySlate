<svg xmlns="http://www.w3.org/2000/svg" width="760" height="555" viewBox="0 0 760 555" role="img" aria-labelledby="title description"><title id="title">input：提示、输入、返回值是三件事</title><desc id="description">用姓名与城市的两次输入显示交互等待和变量值的来源；提示姓名与城市属于程序输出；输入小禾和杭州分别返回两个字符串；返回文字不含提交行尾换行符</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="555" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">input：提示、输入、返回值是三件事</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">执行两次 input，就需要依次提交两行文字。</text><text x="70" y="130" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">程序显示提示</text><text x="355" y="130" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">你提交一行</text><text x="625" y="130" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">返回并保存</text><rect x="30" y="158" width="170" height="66" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="115.0" y="199.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">姓名：</text><rect x="270" y="158" width="170" height="66" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="355.0" y="199.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">小禾 ↵</text><rect x="510" y="158" width="220" height="66" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="620.0" y="199.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">name = &quot;小禾&quot;</text><path d="M210 191 L258 191" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M450 191 L498 191" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="280" width="170" height="66" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="115.0" y="321.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">城市：</text><rect x="270" y="280" width="170" height="66" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="355.0" y="321.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">杭州 ↵</text><rect x="510" y="280" width="220" height="66" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="620.0" y="321.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">city = &quot;杭州&quot;</text><path d="M210 313 L258 313" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M450 313 L498 313" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="408" width="690" height="68" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="380.0" y="450.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">你好，来自杭州的小禾！</text><text x="380" y="524" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">input 返回字符串，并去掉提交时的行尾换行。</text></svg>