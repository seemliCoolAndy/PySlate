<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc"><title id="title">装饰器：先包裹，再调用</title><desc id="desc">@announce 相当于 greet = announce(greet)。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="620" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">装饰器：先包裹，再调用</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">@announce 相当于 greet = announce(greet)。</text><rect x="33" y="126" width="431" height="366" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="248" y="166" font-size="27" font-weight="600" text-anchor="middle" fill="#253d32">wrapper(*args, **kwargs)</text><rect x="70" y="192" width="358" height="64" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="249.0" y="233.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">① print(&quot;开始&quot;)</text><path d="M248 266L248 290" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="300" width="358" height="64" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="249.0" y="341.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">② 原 greet(&quot;小禾&quot;)</text><path d="M248 374L248 398" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="408" width="358" height="62" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="249.0" y="447.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">③ 结束提示；return result</text><text x="596" y="151" font-size="27" font-weight="600" text-anchor="middle" fill="#253d32">屏幕输出顺序</text><text x="595" y="215" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">开始</text><text x="595" y="284" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">结束</text><text x="595" y="353" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">你好，小禾</text><text x="595" y="422" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">greet</text><path d="M465 438L495 438L495 345L506 345" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="546" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">wraps 保留 __name__ 等元信息；返回值要原样传回。</text><text x="380" y="592" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">原函数若抛异常，普通的“结束”语句不会执行。</text></g></svg>