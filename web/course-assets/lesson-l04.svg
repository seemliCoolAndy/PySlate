<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title description"><title id="title">整除与余数：装满几袋，还剩几个</title><desc id="description">把整除和取余落实为17个可数贴纸及三袋五个、余二个；三袋各五个与袋外两个合计17；整除结果3，余数2；加括号得到20，不加得到11</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="590" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">整除与余数：装满几袋，还剩几个</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">本图数量为非负整数；17 / 5 另得到浮点数 3.4。</text><text x="35" y="126" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="start">17 个贴纸，每袋装 5 个</text><rect x="35" y="150" width="160" height="110" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><circle cx="67" cy="183" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="113" cy="183" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="159" cy="183" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="67" cy="226" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="113" cy="226" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><text x="115" y="292" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">完整袋 1</text><rect x="220" y="150" width="160" height="110" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><circle cx="252" cy="183" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="298" cy="183" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="344" cy="183" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="252" cy="226" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="298" cy="226" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><text x="300" y="292" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">完整袋 2</text><rect x="405" y="150" width="160" height="110" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><circle cx="437" cy="183" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="483" cy="183" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="529" cy="183" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="437" cy="226" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="483" cy="226" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><text x="485" y="292" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">完整袋 3</text><circle cx="640" cy="185" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><circle cx="685" cy="185" r="12" fill="#e6bf83" stroke="#3a745c" stroke-width="2"/><text x="663" y="247" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">剩余 2 个</text><rect x="50" y="328" width="300" height="64" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="200.0" y="368.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">17 // 5 = 3</text><rect x="410" y="328" width="300" height="64" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="560.0" y="368.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">17 % 5 = 2</text><text x="380" y="433" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">17 = 3 × 5 + 2</text><rect x="35" y="466" width="330" height="58" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="200.0" y="503.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">(3 + 2) * 4 = 20</text><rect x="395" y="466" width="330" height="58" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="560.0" y="503.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">3 + 2 * 4 = 11</text><text x="380" y="563" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">括号先算；没有括号时，乘法先于加法。</text></svg>