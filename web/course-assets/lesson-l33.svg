<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">JSON：文本与结构，来回转换</title><desc id="desc">dumps / loads 操作字符串；解析后还要检查字段。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="560" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">JSON：文本与结构，来回转换</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">dumps / loads 操作字符串；解析后还要检查字段。</text><rect x="32" y="125" width="294" height="225" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="179" y="166" font-size="28" font-weight="600" text-anchor="middle" fill="#253d32">Python 字典</text><text x="52" y="212" font-size="26" font-weight="400" text-anchor="start" fill="#253d32">{&quot;title&quot;: &quot;阅读&quot;,</text><text x="52" y="252" font-size="26" font-weight="400" text-anchor="start" fill="#253d32"> &quot;done&quot;: True}</text><text x="179" y="316" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">布尔值是 True</text><rect x="434" y="125" width="294" height="225" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="581" y="166" font-size="28" font-weight="600" text-anchor="middle" fill="#253d32">JSON 文本</text><text x="454" y="212" font-size="26" font-weight="400" text-anchor="start" fill="#253d32">{&quot;title&quot;: &quot;阅读&quot;,</text><text x="454" y="252" font-size="26" font-weight="400" text-anchor="start" fill="#253d32"> &quot;done&quot;: true}</text><text x="581" y="316" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">布尔字面量是 true</text><path d="M334 205L426 205" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="184" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">dumps</text><path d="M426 285L334 285" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="323" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">loads</text><rect x="75" y="398" width="610" height="75" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="444.08" font-size="26" font-weight="400" text-anchor="middle" fill="#253d32">读回 tasks → 检查 done → 完成计数 = 1</text><text x="380" y="526" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">不要用 eval 解析文件；JSON 解析不等于业务验证。</text></g></svg>