<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img"><title>条件判断：一次只走一个分支</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker></defs><rect width="760" height="430" rx="18" fill="#f7f8f4"/><text x="35" y="48" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" fill="#253d32" text-anchor="start">条件判断：一次只走一个分支</text><text x="35" y="82" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#647a6b" text-anchor="start">if 条件为真执行左侧；否则执行 else，之后汇合。</text><path d="M380 105 505 170 380 235 255 170z" fill="#e6bf83" stroke="#b6cbb3"/><text x="380" y="179" font-family="Consolas,monospace" font-size="24" fill="#253d32" text-anchor="middle">age &gt;= 18 ?</text><path d="M255 170 L150 170" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="200" y="151" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">True</text><path d="M505 170 L615 170" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="565" y="151" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">False</text><rect x="45" y="190" width="210" height="68" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="150.0" y="232.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">输出：成年人</text><rect x="510" y="190" width="210" height="68" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="615.0" y="232.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">输出：未成年</text><path d="M150 258V320H380M615 258V320H380" stroke="#3a745c" stroke-width="3" fill="none"/><path d="M380 320 L380 350" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="270" y="355" width="220" height="55" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="380.0" y="390.5" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">继续后面的代码</text></svg>