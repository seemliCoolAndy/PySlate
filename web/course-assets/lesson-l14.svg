<svg xmlns="http://www.w3.org/2000/svg" width="760" height="565" viewBox="0 0 760 565" role="img" aria-labelledby="title description"><title id="title">continue 跳过本轮，break 离开循环</title><desc id="description">按真实搜索顺序展示continue后续轮与break后的循环外语句；10至13余数非零，跳过本轮print和break；14整除7，输出后break；15至20没有被访问，循环外搜索结束仍输出</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="565" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">continue 跳过本轮，break 离开循环</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">搜索第一个能被 7 整除的数：10、11、12、13、14。</text><text x="35" y="128" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="start">候选值按顺序到来</text><rect x="35" y="150" width="150" height="63" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="110.0" y="189.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">10</text><rect x="215" y="150" width="150" height="63" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="290.0" y="189.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">11</text><rect x="395" y="150" width="150" height="63" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="470.0" y="189.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">12</text><rect x="575" y="150" width="150" height="63" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="650.0" y="189.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">13</text><text x="380" y="258" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">余数不为 0 → continue：进入下一轮</text><path d="M650 220V284H110V321" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="333" width="150" height="65" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="110.0" y="373.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">14</text><path d="M195 365 L260 365" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="275" y="333" width="205" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="377.5" y="373.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">输出 找到14</text><path d="M490 365 L550 365" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="565" y="333" width="160" height="65" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="645.0" y="373.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">break</text><path d="M645 405V444H380V466" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="240" y="478" width="280" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="380.0" y="516.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">输出 搜索结束</text><rect x="40" y="478" width="165" height="60" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2" stroke-dasharray="7 5"/><text x="122" y="515" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">15…20 未访问</text></svg>