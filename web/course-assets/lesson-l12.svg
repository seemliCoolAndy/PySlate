<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title description"><title id="title">range 的终点不是最后一个输出值</title><desc id="description">正向区间排除6，反向步长从5到1后跨过0停止；range(1,6)恰为1到5；range(5,0,-2)恰为5,3,1；下一项-1越过终点0，因此未产生</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="550" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">range 的终点不是最后一个输出值</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">起点、终点、步长共同决定实际产生哪些整数。</text><text x="35" y="126" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="start">range(1, 6)</text><rect x="40" y="156" width="100" height="62" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="90" y="197" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">1</text><rect x="155" y="156" width="100" height="62" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="205" y="197" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">2</text><rect x="270" y="156" width="100" height="62" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="320" y="197" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">3</text><rect x="385" y="156" width="100" height="62" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="435" y="197" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">4</text><rect x="500" y="156" width="100" height="62" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="550" y="197" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">5</text><rect x="615" y="156" width="100" height="62" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2" stroke-dasharray="7 5"/><text x="665" y="197" fill="#647a6b" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">6</text><text x="325" y="264" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">实际产生：1、2、3、4、5</text><text x="665" y="264" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">不包含 6</text><text x="35" y="327" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="start">range(5, 0, -2)</text><rect x="50" y="358" width="125" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="112.5" y="398.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">5</text><rect x="230" y="358" width="125" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="292.5" y="398.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">3</text><rect x="410" y="358" width="125" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="472.5" y="398.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">1</text><path d="M185 390 L220 390" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M365 390 L400 390" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M545 390 L600 390" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="615" y="358" width="105" height="65" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2" stroke-dasharray="7 5"/><text x="668" y="401" fill="#647a6b" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">-1</text><path d="M620 360L714 420" fill="none" stroke="#935947" stroke-width="3"/><text x="380" y="474" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">每步减 2；下一项越过终点 0，不再产生。</text><text x="380" y="524" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">包含起点，排除终点，按步长前进。</text></svg>