<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">生成器：取一次，运行到下一个 yield</title><desc id="desc">调用只创建对象；取值时计算，交付后暂停。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="610" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">生成器：取一次，运行到下一个 yield</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">调用只创建对象；取值时计算，交付后暂停。</text><rect x="33" y="126" width="270" height="76" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="168.0" y="172.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">squares(4)</text><path d="M316 164L352 164" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="367" y="126" width="360" height="76" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="547.0" y="172.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">创建 stream，函数体尚未执行</text><path d="M168 206L168 229" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="33" y="235" width="270" height="76" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="168.0" y="281.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">next(stream)</text><path d="M316 273L352 273" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="367" y="235" width="360" height="76" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="547.0" y="281.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">运行到 yield 0 → 暂停</text><path d="M168 315L168 338" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="33" y="344" width="270" height="76" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="168.0" y="390.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">for value in stream</text><path d="M316 382L352 382" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="367" y="344" width="360" height="76" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="547.0" y="390.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">继续交付 1、4、9 → 耗尽</text><path d="M168 424L168 447" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="33" y="453" width="270" height="76" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="168.0" y="499.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">list(stream)</text><path d="M316 491L352 491" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="367" y="453" width="360" height="76" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="547.0" y="499.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">同一生成器已耗尽 → []</text><text x="380" y="594" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">list(生成器) 会收集所有剩余结果，并非永远省内存。</text></g></svg>