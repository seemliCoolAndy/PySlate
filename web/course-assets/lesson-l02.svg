<svg xmlns="http://www.w3.org/2000/svg" width="760" height="525" viewBox="0 0 760 525" role="img" aria-labelledby="title description"><title id="title">print：分隔文字与行尾由你决定</title><desc id="description">用实际日期和同一行进度输出区分sep与end；日期三个参数由斜杠分隔；第二个print结尾为空格，第三个print接在同一行；注释不产生控制台输出</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="525" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">print：分隔文字与行尾由你决定</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">sep 放在参数之间；end 放在一次输出的最后。</text><text x="35" y="126" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">print(2026, 10, 20, sep=&quot;/&quot;)</text><rect x="55" y="150" width="150" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="130.0" y="188.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">2026</text><rect x="265" y="150" width="150" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="340.0" y="188.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">10</text><rect x="475" y="150" width="150" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="550.0" y="188.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">20</text><text x="235" y="190" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">/</text><text x="445" y="190" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">/</text><path d="M635 180H700V225H380V229" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><text x="380" y="259" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">2026/10/20  ↵</text><text x="35" y="310" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">print(&quot;进度：&quot;, end=&quot; &quot;)</text><rect x="40" y="335" width="230" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="155.0" y="373.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">进度：</text><rect x="350" y="335" width="360" height="60" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="530.0" y="373.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">完成第一课</text><text x="310" y="374" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">空格</text><text x="380" y="448" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">进度： 完成第一课  ↵</text><text x="380" y="495" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle"># 注释只帮助阅读，不产生输出</text></svg>