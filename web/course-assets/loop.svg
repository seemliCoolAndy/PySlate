<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img"><title>while 循环：先判断，再执行</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker></defs><rect width="760" height="430" rx="18" fill="#f7f8f4"/><text x="35" y="48" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" fill="#253d32" text-anchor="start">while 循环：先判断，再执行</text><text x="35" y="82" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#647a6b" text-anchor="start">循环体必须让条件有机会改变，否则可能无限循环。</text><rect x="45" y="120" width="180" height="60" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="135.0" y="158.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">i = 0</text><path d="M230 150 L290 150" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="300" y="120" width="185" height="60" rx="13" fill="#e6bf83" stroke="#b6cbb3"/><text x="392.5" y="158.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">i &lt; 3 ?</text><path d="M485 150 L555 150" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="524" y="131" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">False</text><rect x="565" y="120" width="145" height="60" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="637.5" y="158.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">离开循环</text><path d="M390 180 L390 235" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="432" y="217" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">True</text><rect x="295" y="245" width="200" height="75" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="395.0" y="290.5" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">print(i)；i += 1</text><path d="M295 280H245V205H330V185" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="380" y="385" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="22" fill="#253d32" text-anchor="middle">输出：0 → 1 → 2；之后 i = 3，条件为假。</text></svg>