<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc"><title id="title">可维护项目：输入、计算、输出各有职责</title><desc id="desc">本课 main 协调；小函数处理转换、验证和计算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="620" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">可维护项目：输入、计算、输出各有职责</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">本课 main 协调；小函数处理转换、验证和计算。</text><rect x="32" y="134" width="180" height="104" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="122.0" y="175.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">rows</text><text x="122.0" y="212.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">[&quot;2&quot;,&quot;3&quot;,&quot;0&quot;]</text><path d="M224 185L259 185" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="134" width="218" height="104" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="379.0" y="175.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">parse_quantity</text><text x="379.0" y="212.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">转换并拒绝负数</text><path d="M500 185L535 185" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="546" y="134" width="182" height="104" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="637.0" y="175.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">总和 = 5</text><text x="637.0" y="212.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">main 显示结果</text><text x="380" y="288" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">inventory_total 对每项解析，再把数量相加。</text><rect x="62" y="325" width="636" height="68" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="368.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">if __name__ == &quot;__main__&quot;:</text><path d="M260 405L190 445" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 405L570 445" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="43" y="458" width="306" height="67" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="196.0" y="500.74" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">直接运行 → main()</text><rect x="410" y="458" width="306" height="67" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="563.0" y="499.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">被 import → 只定义工具</text><text x="380" y="580" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">README 记录运行与备份；tests 记录接口和边界。</text></g></svg>