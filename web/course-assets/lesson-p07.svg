<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">本地账本：记录收支，持久化后再汇总</title><desc id="desc">income / expense 记账，summary 汇总，quit 退出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="650" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">本地账本：记录收支，持久化后再汇总</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">income / expense 记账，summary 汇总，quit 退出。</text><rect x="30" y="121" width="700" height="103" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="160" font-size="25" text-anchor="start" fill="#253e32">金额验证：有限正数 ≤ 1,000,000,000</text><text x="50" y="201" font-size="23" text-anchor="start" fill="#253e32">最多两位小数；不符合就拒绝，不悄悄舍入。</text><rect x="30" y="263" width="315" height="141" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="302" font-size="25" text-anchor="start" fill="#253e32">输入命令</text><text x="50" y="341" font-size="23" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">income 工资 1000</text><text x="50" y="379" font-size="22" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">expense 餐饮 25.50</text><path d="M355 330H389" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="402" y="263" width="328" height="141" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="422" y="302" font-size="25" text-anchor="start" fill="#253e32">内存记录 → .tmp</text><text x="422" y="341" font-size="24" text-anchor="start" fill="#253e32">完整写入 → replace</text><text x="422" y="379" font-size="23" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">project_ledger.csv</text><path d="M570 411V444" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="457" width="700" height="115" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="495" font-size="24" text-anchor="start" fill="#253e32">再记录 expense 文具 8，执行 summary：</text><text x="50" y="538" font-size="25" text-anchor="start" fill="#253e32">收入 1000.00 − 支出 33.50 = 结余 966.50</text><text x="30" y="611" font-size="23" text-anchor="start" fill="#253e32">重开时先验证 CSV；损坏就停止，保留原账本。</text><text x="30" y="644" font-size="22" text-anchor="start" fill="#5e7165">支出按类别累计并排序；类别名称不含空格。</text></g></svg>