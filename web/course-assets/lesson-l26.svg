<svg xmlns="http://www.w3.org/2000/svg" width="760" height="535" viewBox="0 0 760 535" role="img" aria-labelledby="title desc"><title id="title">默认参数：省略时取默认，写名字就明确对应</title><desc id="desc">对应本课 greet(name, greeting=&quot;你好&quot;) 的两次调用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="535" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">默认参数：省略时取默认，写名字就明确对应</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">对应本课 greet(name, greeting=&quot;你好&quot;) 的两次调用。</text><rect x="30" y="115" width="700" height="54" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="151" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">def greet(name, greeting=&quot;你好&quot;):</text><rect x="30" y="195" width="275" height="108" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="48" y="233" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">greet(&quot;小禾&quot;)</text><text x="48" y="272" font-size="23" text-anchor="start" fill="#253e32">只传入 name</text><path d="M315 247H342" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="355" y="195" width="375" height="108" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="375" y="233" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">name = &quot;小禾&quot;</text><text x="375" y="272" font-size="23" text-anchor="start" fill="#253e32">greeting = &quot;你好&quot;  默认</text><rect x="30" y="330" width="275" height="112" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="48" y="357" font-size="22" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">greet(</text><text x="48" y="392" font-size="22" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">greeting=&quot;早上好&quot;,</text><text x="48" y="427" font-size="22" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">name=&quot;阿青&quot;)</text><path d="M315 383H342" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="355" y="330" width="375" height="112" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="375" y="368" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">name = &quot;阿青&quot;</text><text x="375" y="407" font-size="23" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">greeting = &quot;早上好&quot;</text><text x="30" y="488" font-size="24" text-anchor="start" fill="#253e32">返回：你好，小禾！</text><text x="355" y="488" font-size="24" text-anchor="start" fill="#253e32">返回：早上好，阿青！</text><text x="30" y="521" font-size="22" text-anchor="start" fill="#5e7165">默认值在定义时求值一次；本课用不可变字符串。</text></g></svg>