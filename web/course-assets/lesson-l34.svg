<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc"><title id="title">CSV：引号保护字段，转换恢复数值</title><desc id="desc">csv 模块处理逗号；DictReader 按列名读取。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="590" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">CSV：引号保护字段，转换恢复数值</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">csv 模块处理逗号；DictReader 按列名读取。</text><rect x="32" y="125" width="696" height="150" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="54" y="162" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">name,score</text><text x="54" y="208" font-size="30" font-weight="400" text-anchor="start" fill="#253d32">&quot;小禾,甲组&quot;,80</text><text x="54" y="251" font-size="28" font-weight="400" text-anchor="start" fill="#253d32">阿青,90</text><text x="474" y="210" font-size="24" font-weight="400" text-anchor="start" fill="#253d32">一个完整姓名字段</text><path d="M465 225L385 225L200 225" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 287L380 326" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="340" width="640" height="92" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="375.41" font-size="27" font-weight="400" text-anchor="middle" fill="#253d32">row[&quot;name&quot;]  →  &quot;小禾,甲组&quot;</text><text x="380.0" y="414.41" font-size="27" font-weight="400" text-anchor="middle" fill="#253d32">row[&quot;score&quot;] →  &quot;80&quot;（字符串）</text><rect x="93" y="465" width="574" height="64" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="506.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">int(&quot;80&quot;) + int(&quot;90&quot;) = 170</text><text x="380" y="571" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">以 newline=&quot;&quot; 打开文件，由 csv 管理换行。</text></g></svg>