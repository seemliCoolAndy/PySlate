<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">四则计算器：先解析，再计算，最后显示</title><desc id="desc">输入协议是三段文字，例如 12 / 4；不使用 eval。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="610" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">四则计算器：先解析，再计算，最后显示</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">输入协议是三段文字，例如 12 / 4；不使用 eval。</text><rect x="30" y="127" width="700" height="60" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="52" y="166" font-size="26" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">输入：12 / 4</text><path d="M250 193V219" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="232" width="425" height="92" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="271" font-size="25" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">parse_expression(text)</text><text x="50" y="309" font-size="23" text-anchor="start" fill="#253e32">拆成 3 段 → float → 有限数值</text><path d="M250 330V355" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="367" width="425" height="95" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="406" font-size="25" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">calculate(12, &quot;/&quot;, 4)</text><text x="50" y="444" font-size="22" text-anchor="start" fill="#253e32">仅支持 +  −  ×  ÷，除数不能为 0</text><path d="M250 468V494" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="507" width="425" height="66" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="549" font-size="24" text-anchor="start" fill="#253e32">检查结果有限 → 显示：结果：3</text><rect x="510" y="232" width="220" height="230" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="530" y="272" font-size="25" text-anchor="start" fill="#253e32">任一步失败</text><text x="530" y="317" font-size="22" text-anchor="start" fill="#253e32">格式 / 数值错误</text><text x="530" y="357" font-size="23" text-anchor="start" fill="#253e32">未知运算符</text><text x="530" y="397" font-size="23" text-anchor="start" fill="#253e32">除数为 0</text><text x="530" y="439" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">ValueError</text><path d="M463 278H502" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M463 411H502" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M620 469V494" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="510" y="507" width="220" height="66" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="530" y="549" font-size="23" text-anchor="start" fill="#253e32">错误：具体原因</text><text x="30" y="601" font-size="22" text-anchor="start" fill="#5e7165">外层 except 统一显示错误；输入不会被当作程序执行。</text></g></svg>