<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">继承与组合：也是，还是拥有？</title><desc id="desc">summary() 是共同接口；super() 复用父类行为。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="610" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">继承与组合：也是，还是拥有？</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">summary() 是共同接口；super() 复用父类行为。</text><rect x="34" y="135" width="286" height="164" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="177.0" y="186.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">Task</text><text x="177.0" y="226.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">title</text><text x="177.0" y="266.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">summary() → 标题</text><rect x="440" y="135" width="286" height="164" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="583.0" y="188.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">TimedTask(Task)</text><text x="583.0" y="225.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">title + minutes</text><text x="583.0" y="262.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">summary() → 标题与时长</text><path d="M427 197L334 197" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="177" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">也是</text><text x="380" y="354" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">super().summary() 再补充“（20分钟）”</text><rect x="34" y="397" width="692" height="150" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="57" y="438" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">plan 列表：拥有任务（组合）</text><rect x="57" y="462" width="285" height="62" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="199.5" y="501.91" font-size="27" font-weight="400" text-anchor="middle" fill="#253d32">Task(&quot;阅读&quot;)</text><rect x="366" y="462" width="336" height="62" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="534.0" y="501.25" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">TimedTask(&quot;练习&quot;, 20)</text><text x="380" y="590" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">计划不是任务的子类；列表把不同任务组织在一起。</text></g></svg>