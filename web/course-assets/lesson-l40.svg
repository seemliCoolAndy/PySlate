<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">边界测试：从需求挑选五个代表值</title><desc id="desc">clamp 把分数限制在 0～100，合法值保持原样。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="580" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">边界测试：从需求挑选五个代表值</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">clamp 把分数限制在 0～100，合法值保持原样。</text><text x="89" y="153" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">低于下界</text><rect x="29" y="185" width="120" height="70" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="89.0" y="231.22" font-size="34" font-weight="400" text-anchor="middle" fill="#253d32">-1</text><path d="M89 267L89 311" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="29" y="325" width="120" height="70" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="89.0" y="371.22" font-size="34" font-weight="400" text-anchor="middle" fill="#253d32">0</text><text x="234" y="153" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">下界</text><rect x="174" y="185" width="120" height="70" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="234.0" y="231.22" font-size="34" font-weight="400" text-anchor="middle" fill="#253d32">0</text><path d="M234 267L234 311" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="174" y="325" width="120" height="70" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="234.0" y="371.22" font-size="34" font-weight="400" text-anchor="middle" fill="#253d32">0</text><text x="379" y="