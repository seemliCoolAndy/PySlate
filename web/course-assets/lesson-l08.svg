<svg xmlns="http://www.w3.org/2000/svg" width="760" height="565" viewBox="0 0 760 565" role="img" aria-labelledby="title description"><title id="title">比较产生布尔值，原数据不变</title><desc id="description">一个score对象分别送入三项实际比较，保留原值82；82大于等于60为True；82等于100为False；82在0到100闭区间内为True；比较不会给score重新赋值</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="565" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">比较产生布尔值，原数据不变</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">True 表示条件成立；False 表示条件不成立。</text><rect x="35" y="230" width="180" height="100" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="125.0" y="288.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">score = 82</text><rect x="315" y="130" width="280" height="62" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="455.0" y="169.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">score &gt;= 60</text><rect x="315" y="249" width="280" height="62" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="455.0" y="288.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">score == 100</text><rect x="285" y="368" width="330" height="62" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="450.0" y="407.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">0 &lt;= score &lt;= 100</text><rect x="635" y="130" width="105" height="62" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="687.5" y="169.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">True</text><rect x="635" y="249" width="105" height="62" rx="12" fill="#efddd2" stroke="#b6cbb3" stroke-width="2"/><text x="687.5" y="288.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">False</text><rect x="635" y="368" width="105" height="62" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="687.5" y="407.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">True</text><path d="M215 280H250V161H305" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M215 280 L305 280" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M250 280V399H275" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M600 161 L625 161" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M600 280 L625 280" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M620 399 L625 399" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><text x="380" y="489" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">= 绑定名字；== 判断相等，不修改 score。</text><text x="380" y="539" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">所有比较做完后，score 仍然是 82。</text></svg>