<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title description"><title id="title">文本清洗：文字 → 分段 → 新文字</title><desc id="description">显示课程原始字符串经过strip/replace/split/join的精确中间值；strip去掉首尾两空格，replace去掉逗号后的空格；split得到Python、JSON、CSV三个字符串；join结果Python / JSON / CSV，原raw不变</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="600" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">文本清洗：文字 → 分段 → 新文字</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">先处理首尾与分隔空格，再拆分，最后用新分隔符连接。</text><text x="35" y="126" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">raw</text><rect x="135" y="105" width="590" height="62" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="430.0" y="144.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">&quot;  Python, JSON, CSV  &quot;</text><path d="M430 176 L430 212" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><text x="35" y="209" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="start">strip + replace</text><rect x="135" y="228" width="590" height="62" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="430.0" y="267.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">&quot;Python,JSON,CSV&quot;</text><path d="M430 299 L430 334" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><text x="35" y="332" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="start">split(&quot;,&quot;)</text><rect x="190" y="350" width="160" height="63" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="270.0" y="389.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">&quot;Python&quot;</text><rect x="375" y="350" width="160" height="63" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="455.0" y="389.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">&quot;JSON&quot;</text><rect x="560" y="350" width="160" height="63" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="640.0" y="389.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">&quot;CSV&quot;</text><path d="M270 423V438H455M640 423V438H455" fill="none" stroke="#3a745c" stroke-width="3"/><path d="M455 438 L455 464" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><text x="35" y="458" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="start">&quot; / &quot;.join</text><rect x="135" y="478" width="590" height="62" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="430.0" y="517.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">&quot;Python / JSON / CSV&quot;</text><text x="380" y="579" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">每一步保存新结果；原 raw 不会被这些方法改写。</text></svg>