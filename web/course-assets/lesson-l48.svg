<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">unittest：三种需求，三个独立测试</title><desc id="desc">期望抛出异常，也是一项成功的测试。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="610" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">unittest：三种需求，三个独立测试</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">期望抛出异常，也是一项成功的测试。</text><rect x="27" y="133" width="218" height="203" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="136" y="174" font-size="25" font-weight="600" text-anchor="middle" fill="#253d32">test_normal</text><text x="136" y="225" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">total_price(8, 3)</text><text x="136" y="270" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">assertEqual → 24</text><text x="136" y="311" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">比较结果</text><path d="M136 346L380 395" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="271" y="133" width="218" height="203" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380" y="174" font-size="25" font-weight="600" text-anchor="middle" fill="#253d32">test_zero</text><text x="380" y="225" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">total_price(8, 0)</text><text x="380" y="270" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">assertEqual → 0</text><text x="380" y="311" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">比较结果</text><path d="M380 346L380 395" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="133" width="218" height="203" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="624" y="174" font-size="25" font-weight="600" text-anchor="middle" fill="#253d32">test_invalid</text><text x="624" y="225" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">total_price(-1, 2)</text><text x="624" y="270" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">assertRaises</text><text x="624" y="311" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">ValueError</text><path d="M624 346L380 395" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="131" y="408" width="498" height="66" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="450.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">suite → runner → 通过 3 项测试</text><rect x="35" y="510" width="690" height="65" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="551.08" font-size="26" font-weight="400" text-anchor="middle" fill="#253d32">发现缺陷 → 写复现用例 → 修复 → 重跑测试</text><text x="380" y="601" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">测试互相独立；不能依赖上一个测试留下的状态。</text></g></svg>