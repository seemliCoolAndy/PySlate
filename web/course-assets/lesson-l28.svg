<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">导入方式决定：用模块名，还是直接用工具名</title><desc id="desc">两种导入来自同一个标准库 math，不需要下载。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="520" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">导入方式决定：用模块名，还是直接用工具名</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">两种导入来自同一个标准库 math，不需要下载。</text><rect x="30" y="119" width="330" height="285" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="52" y="157" font-size="25" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">import math</text><path d="M50 178L340 178" stroke="#b9cbb6" stroke-width="1.5"/><text x="52" y="222" font-size="25" text-anchor="start" fill="#253e32">math 模块</text><text x="70" y="269" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">sqrt(81) → 9.0</text><text x="70" y="317" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">ceil(2.3) → 3</text><text x="70" y="365" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">pi → 3.14159…</text><rect x="410" y="119" width="320" height="285" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="430" y="157" font-size="23" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">from math import ceil</text><path d="M430 178L710 178" stroke="#b9cbb6" stroke-width="1.5"/><text x="430" y="222" font-size="24" text-anchor="start" fill="#253e32">当前代码中的名字</text><text x="445" y="285" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">ceil(2.3) → 3</text><path d="M355 310H395V279H430" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><text x="435" y="355" font-size="24" text-anchor="start" fill="#253e32">直接使用 ceil</text><rect x="30" y="435" width="700" height="60" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="474" font-size="23" text-anchor="start" fill="#253e32">自己的文件不要叫 math.py，以免遮蔽标准库。</text></g></svg>