<svg xmlns="http://www.w3.org/2000/svg" width="760" height="445" viewBox="0 0 760 445" role="img"><title>类与对象：同一种定义，各自保存状态</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker></defs><rect width="760" height="445" rx="18" fill="#f7f8f4"/><text x="35" y="48" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" fill="#253d32" text-anchor="start">类与对象：同一种定义，各自保存状态</text><text x="35" y="82" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#647a6b" text-anchor="start">实例属性属于各个对象；方法描述对象可以执行的操作。</text><rect x="215" y="120" width="330" height="80" rx="13" fill="#e6bf83" stroke="#b6cbb3"/><text x="380.0" y="168.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" fill="#253d32" text-anchor="middle">类 Counter：count、add()</text><path d="M285 205 L200 260" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="220" y="232" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">实例化</text><path d="M475 205 L560 260" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="535" y="232" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">实例化</text><rect x="70" y="270" width="260" height="90" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="200.0" y="323.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">a：count = 1</text><rect x="430" y="270" width="260" height="90" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="560.0" y="323.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">b：count = 0</text><text x="380" y="410" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="22" fill="#253d32" text-anchor="middle">a.add() 改变 a 的实例状态；不会改变 b.count。</text></svg>