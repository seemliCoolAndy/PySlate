<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title description"><title id="title">列表原地修改：添加、替换、取出</title><desc id="description">按真实代码顺序展示每个列表状态和pop返回值，而不是只有操作名称；append后为阅读练习复习；索引1替换后为阅读写习题复习；pop0返回阅读，剩余写习题复习且索引前移</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="590" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">列表原地修改：添加、替换、取出</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">append 改变原列表；pop 删除并返回一个元素。</text><text x="35" y="125" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">初始</text><text x="35" y="233" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="start">append</text><text x="35" y="341" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="start">[1] =</text><text x="35" y="449" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="start">pop(0)</text><rect x="190" y="100" width="155" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="267.5" y="138.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">阅读</text><rect x="365" y="100" width="155" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="442.5" y="138.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">练习</text><rect x="190" y="208" width="155" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="267.5" y="246.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">阅读</text><rect x="365" y="208" width="155" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="442.5" y="246.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">练习</text><rect x="540" y="208" width="155" height="60" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="617.5" y="246.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">复习</text><rect x="190" y="316" width="155" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="267.5" y="354.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">阅读</text><rect x="365" y="316" width="155" height="60" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="442.5" y="354.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">写习题</text><rect x="540" y="316" width="155" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="617.5" y="354.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">复习</text><path d="M365 167 L365 193" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M365 275 L365 302" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M365 384 L365 411" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="190" y="424" width="220" height="64" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="300.0" y="464.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">写习题</text><rect x="435" y="424" width="220" height="64" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="545.0" y="464.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">复习</text><rect x="190" y="510" width="465" height="57" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="423" y="548" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">finished 得到被删除的 &quot;阅读&quot;</text><text x="637" y="173" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">末尾添加</text><text x="610" y="289" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">索引 1 替换</text></svg>