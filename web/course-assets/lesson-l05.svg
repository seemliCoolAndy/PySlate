<svg xmlns="http://www.w3.org/2000/svg" width="760" height="595" viewBox="0 0 760 595" role="img" aria-labelledby="title description"><title id="title">f 字符串：把变量值放进文字</title><desc id="description">用name和minutes替换模板，另展示3.5的两位小数格式；name替换成小禾，minutes替换成25；最终文本不包含花括号；格式3.50不修改原数值3.5</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="595" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">f 字符串：把变量值放进文字</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">大括号中计算表达式，再把结果放到相应位置。</text><rect x="45" y="118" width="270" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="180.0" y="158.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">name = &quot;小禾&quot;</text><rect x="445" y="118" width="270" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="580.0" y="158.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">minutes = 25</text><path d="M180 190 L245 243" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M580 190 L510 243" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="255" width="680" height="70" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="380" y="299" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">f&quot;{name}学习了{minutes}分钟&quot;</text><path d="M380 332 L380 374" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="95" y="386" width="570" height="65" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="380.0" y="426.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">小禾学习了25分钟</text><text x="35" y="500" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">price = 3.5</text><path d="M225 491 L310 491" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="325" y="461" width="170" height="60" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="410.0" y="499.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">:.2f</text><path d="M505 491 L575 491" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="585" y="461" width="130" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="650.0" y="499.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">3.50</text><text x="380" y="565" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">两位小数是显示规则；price 的值仍是 3.5。</text></svg>