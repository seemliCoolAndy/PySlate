<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img"><title>函数：传入参数，返回结果</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker></defs><rect width="760" height="430" rx="18" fill="#f7f8f4"/><text x="35" y="48" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" fill="#253d32" text-anchor="start">函数：传入参数，返回结果</text><text x="35" y="82" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#647a6b" text-anchor="start">调用函数时执行函数体；return 将结果交回调用处。</text><text x="45" y="136" font-family="Consolas,monospace" font-size="25" fill="#253d32" text-anchor="start">def double(n):</text><text x="45" y="173" font-family="Consolas,monospace" font-size="25" fill="#253d32" text-anchor="start">    return n * 2</text><rect x="40" y="235" width="160" height="70" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="120.0" y="278.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">参数 3</text><rect x="285" y="220" width="200" height="100" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="385.0" y="278.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="26" fill="#253d32" text-anchor="middle">double(n)</text><rect x="570" y="235" width="145" height="70" rx="13" fill="#e6bf83" stroke="#b6cbb3"/><text x="642.5" y="278.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">结果 6</text><path d="M210 270 L270 270" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M495 270 L555 270" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="380" y="385" font-family="Consolas,monospace" font-size="23" fill="#253d32" text-anchor="middle">answer = double(3)  →  answer 得到 6</text></svg>