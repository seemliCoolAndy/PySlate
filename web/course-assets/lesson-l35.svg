<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc"><title id="title">数值与随机：验证规则，保留复现条件</title><desc id="desc">固定种子用于同环境调试；模拟随机不适合安全令牌。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="590" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">数值与随机：验证规则，保留复现条件</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">固定种子用于同环境调试；模拟随机不适合安全令牌。</text><rect x="32" y="126" width="334" height="130" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="199.0" y="179.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">math.sqrt(144)</text><text x="199.0" y="221.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">12.0</text><rect x="394" y="126" width="334" height="130" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="561.0" y="180.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">math.isclose(0.1+0.2, 0.3)</text><text x="561.0" y="217.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">True</text><rect x="55" y="300" width="650" height="65" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="342.07" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">rng = random.Random(2026)</text><path d="M380 376L380 410" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="447" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">randint(1, 6)：两端都可能出现</text><rect x="92" y="470" width="76" height="64" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="130.0" y="511.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">1</text><rect x="190" y="470" width="76" height="64" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="228.0" y="511.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">2</text><rect x="288" y="470" width="76" height="64" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="326.0" y="511.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">3</text><rect x="386" y="470" width="76" height="64" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="424.0" y="511.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">4</text><rect x="484" y="470" width="76" height="64" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="522.0" y="511.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">5</text><rect x="582" y="470" width="76" height="64" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="620.0" y="511.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">6</text><text x="380" y="576" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">验证 1 ≤ die ≤ 6；不要把某次随机结果写成永久预期。</text></g></svg>