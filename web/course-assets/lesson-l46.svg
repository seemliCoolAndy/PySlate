<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">with 与 finally：异常也要清理</title><desc id="desc">contextmanager 用 yield 交出资源，finally 负责退出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="610" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">with 与 finally：异常也要清理</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">contextmanager 用 yield 交出资源，finally 负责退出。</text><rect x="34" y="131" width="58" height="58" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="63.0" y="169.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">1</text><rect x="116" y="121" width="610" height="81" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="139" y="153" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">进入 session</text><text x="139" y="186" font-size="25" font-weight="400" text-anchor="start" fill="#253d32">events 加入“打开”；yield 字典</text><path d="M63 193L63 217" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="229" width="58" height="58" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="63.0" y="267.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">2</text><rect x="116" y="219" width="610" height="81" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="139" y="251" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">执行 with 块</text><text x="139" y="284" font-size="25" font-weight="400" text-anchor="start" fill="#253d32">读取 ready=True；抛 ValueError</text><path d="M63 291L63 315" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="327" width="58" height="58" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="63.0" y="365.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">3</text><rect x="116" y="317" width="610" height="81" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="139" y="349" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">finally 先清理</text><text x="139" y="382" font-size="25" font-weight="400" text-anchor="start" fill="#253d32">events 加入“关闭”</text><path d="M63 389L63 413" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="425" width="58" height="58" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="63.0" y="463.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">4</text><rect x="116" y="415" width="610" height="81" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="139" y="447" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">外层 except 处理</text><text x="139" y="480" font-size="25" font-weight="400" text-anchor="start" fill="#253d32">events 加入“已处理”</text><rect x="58" y="535" width="644" height="58" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="572.91" font-size="27" font-weight="400" text-anchor="middle" fill="#253d32">events = [&quot;打开&quot;, &quot;关闭&quot;, &quot;已处理&quot;]</text></g></svg>