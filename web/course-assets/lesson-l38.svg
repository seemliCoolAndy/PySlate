<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc"><title id="title">稳定排序：相同分数，先后顺序不变</title><desc id="desc">sorted 返回新列表；key 提取 score，reverse=True 降序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="590" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">稳定排序：相同分数，先后顺序不变</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">sorted 返回新列表；key 提取 score，reverse=True 降序。</text><text x="168" y="143" font-size="28" font-weight="600" text-anchor="middle" fill="#253d32">原 records</text><text x="592" y="143" font-size="28" font-weight="600" text-anchor="middle" fill="#253d32">新 ranked</text><rect x="40" y="165" width="256" height="64" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="168.0" y="206.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">小禾   80</text><rect x="40" y="245" width="256" height="64" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="168.0" y="286.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">阿青   90</text><rect x="40" y="325" width="256" height="64" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="168.0" y="366.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">小川   80</text><rect x="464" y="165" width="256" height="64" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="592.0" y="206.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">阿青   90</text><rect x="464" y="245" width="256" height="64" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="592.0" y="286.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">小禾   80</text><rect x="464" y="325" width="256" height="64" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="592.0" y="366.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">小川   80</text><path d="M310 276L450 196" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><path d="M310 196L450 276" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><path d="M310 356L450 356" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="430" width="610" height="68" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="473.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">80 分：小禾在前，小川仍在后</text><text x="380" y="554" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">原列表未修改，所以 records[0][&quot;name&quot;] 仍是“小禾”。</text></g></svg>