<svg xmlns="http://www.w3.org/2000/svg" width="760" height="595" viewBox="0 0 760 595" role="img" aria-labelledby="title description"><title id="title">嵌套循环：固定一行，再走完三列</title><desc id="description">用2×3真实座位格和执行编号表示两层循环的乘积次数；顺序为1-1,1-2,1-3,2-1,2-2,2-3；第二行内层从col1重启；总执行次数为2乘3等于6</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="595" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">嵌套循环：固定一行，再走完三列</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">外层每推进一次，内层都重新完整遍历。</text><text x="35" y="125" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">外层 row</text><text x="260" y="125" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">col = 1</text><text x="445" y="125" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">col = 2</text><text x="630" y="125" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">col = 3</text><text x="78" y="210" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">row = 1</text><rect x="180" y="165" width="160" height="75" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="260.0" y="210.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">座位1-1</text><text x="260" y="276" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">第1次</text><path d="M344 202 L358 202" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="365" y="165" width="160" height="75" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="445.0" y="210.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">座位1-2</text><text x="445" y="276" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">第2次</text><path d="M529 202 L543 202" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="550" y="165" width="160" height="75" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="630.0" y="210.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">座位1-3</text><text x="630" y="276" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">第3次</text><text x="78" y="370" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">row = 2</text><rect x="180" y="325" width="160" height="75" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="260.0" y="370.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">座位2-1</text><text x="260" y="436" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">第4次</text><path d="M344 362 L358 362" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="365" y="325" width="160" height="75" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="445.0" y="370.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">座位2-2</text><text x="445" y="436" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">第5次</text><path d="M529 362 L543 362" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="550" y="325" width="160" height="75" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="630.0" y="370.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">座位2-3</text><text x="630" y="436" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">第6次</text><path d="M710 203H730V302H160V361H170" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><text x="380" y="483" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">row 变成 2 时，内层 col 重新从 1 开始。</text><rect x="180" y="516" width="400" height="58" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="380.0" y="553.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">2 行 × 3 列 = 6 个座位</text></svg>