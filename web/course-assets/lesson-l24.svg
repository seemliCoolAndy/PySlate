<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title description"><title id="title">推导式：先取值、再筛选、最后变换</title><desc id="description">四个输入中丢弃非正数，仅将2和5平方后加入新列表；输入为负2、0、2、5；过滤n&gt;0只保留2、5；平方变换得到4、25，结果新列表且原numbers不变</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="600" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">推导式：先取值、再筛选、最后变换</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">表达式虽写在最前，理解时仍先从 for 读起。</text><rect x="35" y="109" width="690" height="64" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="380" y="151" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">[n * n for n in numbers if n &gt; 0]</text><text x="35" y="214" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">依次取值</text><rect x="155" y="190" width="110" height="63" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="210.0" y="229.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">-2</text><path d="M163 266L257 306" fill="none" stroke="#935947" stroke-width="3"/><path d="M257 266L163 306" fill="none" stroke="#935947" stroke-width="3"/><text x="210" y="345" fill="#935947" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">舍弃</text><rect x="295" y="190" width="110" height="63" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="350.0" y="229.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">0</text><path d="M303 266L397 306" fill="none" stroke="#935947" stroke-width="3"/><path d="M397 266L303 306" fill="none" stroke="#935947" stroke-width="3"/><text x="350" y="345" fill="#935947" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">舍弃</text><rect x="435" y="190" width="110" height="63" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="490.0" y="229.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">2</text><path d="M490 263 L490 303" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="315" width="110" height="58" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="490.0" y="352.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">n &gt; 0</text><path d="M490 383 L490 422" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="435" width="110" height="58" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="490.0" y="472.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">4</text><rect x="575" y="190" width="110" height="63" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="630.0" y="229.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">5</text><path d="M630 263 L630 303" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="575" y="315" width="110" height="58" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="630.0" y="352.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">n &gt; 0</text><path d="M630 383 L630 422" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="575" y="435" width="110" height="58" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="630.0" y="472.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">25</text><text x="245" y="463" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">计算 n * n</text><rect x="155" y="523" width="530" height="52" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="420.0" y="557.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">新列表：[4, 25]</text><text x="35" y="335" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">筛选</text><text x="35" y="470" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">变换</text></svg>