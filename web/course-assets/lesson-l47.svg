<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc"><title id="title">类型提示：写清契约，不自动验证</title><desc id="desc">mean(scores: list[int]) → float | None</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="590" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">类型提示：写清契约，不自动验证</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">mean(scores: list[int]) → float | None</text><rect x="112" y="128" width="536" height="74" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="174.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">mean：有分数才计算平均值</text><path d="M270 215L195 260" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><path d="M490 215L565 260" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="275" width="302" height="76" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="189.0" y="324.22" font-size="34" font-weight="400" text-anchor="middle" fill="#253d32">[80, 90]</text><rect x="420" y="275" width="302" height="76" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="571.0" y="324.22" font-size="34" font-weight="400" text-anchor="middle" fill="#253d32">[]</text><path d="M189 363L189 400" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><path d="M571 363L571 400" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="414" width="302" height="68" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="189.0" y="457.9" font-size="30" font-weight="400" text-anchor="middle" fill="#253d32">85.0：float</text><rect x="420" y="414" width="302" height="68" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="571.0" y="457.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">None：没有数据</text><text x="380" y="530" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">调用者先判断 is not None，再做小数格式化。</text><text x="380" y="576" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">注解不负责转换或拒绝错误输入；外部数据仍需校验。</text></g></svg>