<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img"><title>列表索引与切片</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker></defs><rect width="760" height="430" rx="18" fill="#f7f8f4"/><text x="35" y="48" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" fill="#253d32" text-anchor="start">列表索引与切片</text><text x="35" y="82" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#647a6b" text-anchor="start">items[1:3] 包含起点 1，不包含终点 3。</text><text x="45" y="135" font-family="Consolas,monospace" font-size="25" fill="#253d32" text-anchor="start">items = [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;]</text><rect x="65" y="190" width="140" height="72" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="135.0" y="234.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30" fill="#253d32" text-anchor="middle">A</text><text x="135" y="172" font-family="Consolas,monospace" font-size="23" fill="#253d32" text-anchor="middle">0</text><text x="135" y="293" font-family="Consolas,monospace" font-size="23" fill="#647a6b" text-anchor="middle">-4</text><rect x="225" y="190" width="140" height="72" rx="13" fill="#e6bf83" stroke="#b6cbb3"/><text x="295.0" y="234.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30" fill="#253d32" text-anchor="middle">B</text><text x="295" y="172" font-family="Consolas,monospace" font-size="23" fill="#253d32" text-anchor="middle">1</text><text x="295" y="293" font-family="Consolas,monospace" font-size="23" fill="#647a6b" text-anchor="middle">-3</text><rect x="385" y="190" width="140" height="72" rx="13" fill="#e6bf83" stroke="#b6cbb3"/><text x="455.0" y="234.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30" fill="#253d32" text-anchor="middle">C</text><text x="455" y="172" font-family="Consolas,monospace" font-size="23" fill="#253d32" text-anchor="middle">2</text><text x="455" y="293" font-family="Consolas,monospace" font-size="23" fill="#647a6b" text-anchor="middle">-2</text><rect x="545" y="190" width="140" height="72" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="615.0" y="234.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30" fill="#253d32" text-anchor="middle">D</text><text x="615" y="172" font-family="Consolas,monospace" font-size="23" fill="#253d32" text-anchor="middle">3</text><text x="615" y="293" font-family="Consolas,monospace" font-size="23" fill="#647a6b" text-anchor="middle">-1</text><text x="380" y="347" font-family="Consolas,monospace" font-size="26" fill="#253d32" text-anchor="middle">索引 1、2 → [&quot;B&quot;, &quot;C&quot;]</text><text x="380" y="390" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">负索引从右边开始：-1 表示最后一项。</text></svg>