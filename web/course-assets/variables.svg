<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img"><title>变量名，指向一个对象</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker></defs><rect width="760" height="430" rx="18" fill="#f7f8f4"/><text x="35" y="48" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" fill="#253d32" text-anchor="start">变量名，指向一个对象</text><text x="35" y="82" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#647a6b" text-anchor="start">赋值建立名称与对象的关系；重新赋值会改变指向。</text><text x="55" y="139" font-family="Consolas,monospace" font-size="24" fill="#253d32" text-anchor="start">score = 8</text><rect x="50" y="170" width="180" height="65" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="140.0" y="210.5" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">score</text><rect x="485" y="170" width="200" height="65" rx="13" fill="#e6bf83" stroke="#b6cbb3"/><text x="585.0" y="210.5" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">整数对象 8</text><path d="M245 202 L470 202" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="357.5" y="192.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">引用</text><text x="55" y="295" font-family="Consolas,monospace" font-size="24" fill="#253d32" text-anchor="start">score = 10</text><rect x="50" y="325" width="180" height="65" rx="13" fill="#e2ecdf" stroke="#b6cbb3"/><text x="140.0" y="365.5" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">score</text><rect x="485" y="325" width="200" height="65" rx="13" fill="#e6bf83" stroke="#b6cbb3"/><text x="585.0" y="365.5" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#253d32" text-anchor="middle">整数对象 10</text><path d="M245 357 L470 357" stroke="#3a745c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="357.5" y="347.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" fill="#253d32" text-anchor="middle">新的引用</text></svg>