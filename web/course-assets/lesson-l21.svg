<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title description"><title id="title">解包按位置分配，交换先取得旧值</title><desc id="description">用两阶段位置箭头展示point解包和x/y同时交换，补充单元素逗号；point3,4解包后x3、y4；交换后x4、y3，point仍为3,4；单元素元组必须含逗号</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="600" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">解包按位置分配，交换先取得旧值</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">元组结构不变；名字 x、y 可以重新绑定。</text><text x="35" y="125" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">① point</text><rect x="220" y="105" width="150" height="60" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="295.0" y="143.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">3</text><rect x="430" y="105" width="150" height="60" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="505.0" y="143.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">4</text><path d="M295 175 L295 222" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M505 175 L505 222" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="220" y="236" width="150" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="295.0" y="274.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">x = 3</text><rect x="430" y="236" width="150" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="505.0" y="274.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">y = 4</text><text x="35" y="337" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="start">② x, y = y, x</text><path d="M295 306V345L505 405" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><path d="M505 306V345L295 405" fill="none" stroke="#e6bf83" stroke-width="3"/><path d="M310 398 L295 405" fill="none" stroke="#e6bf83" stroke-width="3" marker-end="url(#gold)"/><rect x="220" y="423" width="150" height="60" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="295.0" y="461.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">x = 4</text><rect x="430" y="423" width="150" height="60" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="505.0" y="461.0" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">y = 3</text><text x="380" y="533" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">先取得右侧两个旧值，再绑定左侧两个名字。</text><text x="380" y="579" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">单元素元组写 (7,)；(7) 只是整数。</text></svg>