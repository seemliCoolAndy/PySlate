<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">猜数字：只有合法猜测，才消耗一次机会</title><desc id="desc">固定种子 7 的示例秘密数是 11；最多 5 次有效机会。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="610" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">猜数字：只有合法猜测，才消耗一次机会</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">固定种子 7 的示例秘密数是 11；最多 5 次有效机会。</text><rect x="30" y="128" width="202" height="103" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="49" y="168" font-size="24" text-anchor="start" fill="#253e32">输入一行文字</text><text x="49" y="207" font-size="22" text-anchor="start" fill="#253e32">例如：8 / abc</text><path d="M240 177H268" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="280" y="128" width="225" height="103" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="299" y="168" font-size="24" text-anchor="start" fill="#253e32">整数且在 1～20？</text><text x="299" y="207" font-size="22" text-anchor="start" fill="#253e32">两层验证都通过</text><path d="M513 177H541" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="553" y="128" width="177" height="103" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="572" y="168" font-size="25" text-anchor="start" fill="#253e32">次数 + 1</text><text x="572" y="207" font-size="23" text-anchor="start" fill="#253e32">有效猜测</text><path d="M392 235V278H131V238" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><text x="158" y="270" font-size="22" text-anchor="start" fill="#5e7165">无效：提示，不扣次数</text><path d="M641 238V321" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="334" width="210" height="105" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="48" y="375" font-size="25" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">guess &lt; 11</text><text x="48" y="415" font-size="24" text-anchor="start" fill="#253e32">偏小，再猜</text><rect x="275" y="334" width="210" height="105" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="293" y="375" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">guess == 11</text><text x="293" y="415" font-size="24" text-anchor="start" fill="#253e32">命中 → break</text><rect x="520" y="334" width="210" height="105" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="538" y="375" font-size="25" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">guess &gt; 11</text><text x="538" y="415" font-size="24" text-anchor="start" fill="#253e32">偏大，再猜</text><path d="M641 320H135V330" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M641 320H380V330" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M641 320H625V330" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="30" y="478" width="700" height="93" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="515" font-size="24" text-anchor="start" fill="#253e32">有效机会未满 5 次 → 回到输入</text><text x="50" y="551" font-size="24" text-anchor="start" fill="#253e32">5 次都未命中 → while 的 else 公布答案</text><text x="30" y="600" font-size="22" text-anchor="start" fill="#5e7165">猜中时 break，会跳过 while 的 else。</text></g></svg>