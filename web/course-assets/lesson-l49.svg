<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc"><title id="title">解释器与依赖：先认清正在用谁</title><desc id="desc">标准库随解释器提供；第三方包需满足版本与平台要求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="620" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">解释器与依赖：先认清正在用谁</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">标准库随解释器提供；第三方包需满足版本与平台要求。</text><rect x="32" y="129" width="220" height="100" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="142.0" y="168.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">Python 解释器</text><text x="142.0" y="208.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">执行代码</text><rect x="270" y="129" width="220" height="100" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="168.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">标准库</text><text x="380.0" y="208.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">如 pathlib</text><rect x="508" y="129" width="220" height="100" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="618.0" y="168.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">第三方包</text><text x="618.0" y="208.24" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">另外安装</text><text x="380" y="281" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">完整桌面 Python：两个 venv 可隔离包版本</text><rect x="43" y="313" width="305" height="119" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="195.5" y="361.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">环境 A</text><text x="195.5" y="402.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">某依赖：版本 1</text><rect x="412" y="313" width="305" height="119" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="564.5" y="361.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">环境 B</text><text x="564.5" y="402.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">同依赖：版本 2</text><text x="380" y="476" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">用该环境的 python -m pip，减少装错环境。</text><rect x="37" y="509" width="686" height="61" rx="14" fill="#ffffff" stroke="#a9c0ac" stroke-width="2"/><text x="380.0" y="547.75" font-size="25" font-weight="400" text-anchor="middle" fill="#253d32">PySlate 嵌入版：不承诺 pip / venv / 任意扩展</text><text x="380" y="605" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">venv 隔离依赖版本，不能限制代码的系统权限。</text></g></svg>