<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc"><title id="title">包的层级与查询文本的往返转换</title><desc id="desc">urllib 是包，parse 是子模块；这里不发出网络请求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="590" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">包的层级与查询文本的往返转换</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">urllib 是包，parse 是子模块；这里不发出网络请求。</text><rect x="30" y="116" width="700" height="126" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="52" y="154" font-size="24" text-anchor="start" fill="#253e32">urllib  包</text><path d="M82 168L82 211" stroke="#b9cbb6" stroke-width="1.5"/><path d="M82 211L135 211" stroke="#b9cbb6" stroke-width="1.5"/><text x="146" y="219" font-size="24" text-anchor="start" fill="#253e32">parse  子模块 → urlencode、parse_qs</text><rect x="30" y="268" width="700" height="65" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="309" font-size="23" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">{&quot;topic&quot;: &quot;Python notes&quot;, &quot;page&quot;: 2}</text><path d="M380 337V369" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><text x="404" y="363" font-size="22" text-anchor="start" fill="#5e7165" font-family="Consolas,monospace">urlencode</text><rect x="30" y="382" width="700" height="58" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="419" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">topic=Python+notes&amp;page=2</text><path d="M380 445V474" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><text x="404" y="471" font-size="22" text-anchor="start" fill="#5e7165" font-family="Consolas,monospace">parse_qs</text><rect x="30" y="486" width="700" height="62" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="524" font-size="22" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">{&quot;topic&quot;: [&quot;Python notes&quot;], &quot;page&quot;: [&quot;2&quot;]}</text><text x="30" y="580" font-size="22" text-anchor="start" fill="#5e7165">解析后的值是列表；[0] 取得本例的第一个值。</text></g></svg>