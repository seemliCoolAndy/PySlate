<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title description"><title id="title">for 遍历 banana：计数只在匹配时增加</title><desc id="description">逐字符与逐轮计数配对，强调三个a以及最终统一输出；banana六轮顺序为b,a,n,a,n,a；每轮后count为0,1,1,2,2,3；最终a数量3，计数器没有在每轮重置</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="560" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">for 遍历 banana：计数只在匹配时增加</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">从左到右取字符；初始化放在循环之外。</text><rect x="35" y="113" width="210" height="57" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="140.0" y="149.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">循环前 count = 0</text><text x="35" y="223" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">字符</text><text x="35" y="348" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">本轮后</text><text x="35" y="381" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="start">count</text><rect x="142" y="184" width="80" height="65" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="182.0" y="224.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">b</text><path d="M182 258 L182 298" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="142" y="311" width="80" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="182.0" y="351.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">0</text><rect x="238" y="184" width="80" height="65" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="278.0" y="224.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">a</text><path d="M278 258 L278 298" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="238" y="311" width="80" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="278.0" y="351.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">1</text><rect x="334" y="184" width="80" height="65" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="374.0" y="224.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">n</text><path d="M374 258 L374 298" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="334" y="311" width="80" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="374.0" y="351.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">1</text><rect x="430" y="184" width="80" height="65" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="470.0" y="224.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">a</text><path d="M470 258 L470 298" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="430" y="311" width="80" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="470.0" y="351.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">2</text><rect x="526" y="184" width="80" height="65" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="566.0" y="224.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">n</text><path d="M566 258 L566 298" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="526" y="311" width="80" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="566.0" y="351.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">2</text><rect x="622" y="184" width="80" height="65" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="662.0" y="224.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">a</text><path d="M662 258 L662 298" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#a)"/><rect x="622" y="311" width="80" height="65" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="662.0" y="351.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">3</text><text x="380" y="437" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="24" text-anchor="middle">只有 letter == &quot;a&quot; 的三轮才加 1。</text><rect x="160" y="472" width="440" height="62" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="380.0" y="511.0" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">循环结束后统一输出：3</text></svg>