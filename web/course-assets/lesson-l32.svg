<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc"><title id="title">Path 用 / 组合路径，由平台处理分隔符</title><desc id="desc">Path(&quot;demo_data&quot;) / &quot;note.txt&quot;，不用手工拼接反斜杠。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537b61"/></marker></defs><rect width="760" height="530" rx="20" fill="#fbf8ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="49" font-size="29" text-anchor="start" fill="#253e32">Path 用 / 组合路径，由平台处理分隔符</text><text x="30" y="86" font-size="22" text-anchor="start" fill="#5e7165">Path(&quot;demo_data&quot;) / &quot;note.txt&quot;，不用手工拼接反斜杠。</text><rect x="30" y="120" width="700" height="61" rx="14" fill="#fffdf7" stroke="#b9cbb6" stroke-width="1.5"/><text x="52" y="159" font-size="25" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">folder = Path(&quot;demo_data&quot;)</text><path d="M380 187V218" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><text x="410" y="212" font-size="22" text-anchor="start" fill="#5e7165">创建目录（允许已有）</text><rect x="30" y="231" width="260" height="173" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="52" y="273" font-size="27" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">demo_data/</text><path d="M72 291L72 347" stroke="#b9cbb6" stroke-width="1.5"/><path d="M72 347L110 347" stroke="#b9cbb6" stroke-width="1.5"/><text x="122" y="356" font-size="24" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">note.txt</text><path d="M300 320H345" stroke="#537b61" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="360" y="231" width="370" height="173" rx="14" fill="#f0d292" stroke="#b9cbb6" stroke-width="1.5"/><text x="382" y="272" font-size="22" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">note = folder / &quot;note.txt&quot;</text><text x="382" y="321" font-size="23" text-anchor="start" fill="#253e32">write_text → 写入中文</text><text x="382" y="365" font-size="23" text-anchor="start" fill="#253e32">read_text → 读回中文</text><rect x="30" y="435" width="700" height="65" rx="14" fill="#e1eadc" stroke="#b9cbb6" stroke-width="1.5"/><text x="50" y="475" font-size="23" text-anchor="start" fill="#253e32" font-family="Consolas,monospace">glob(&quot;*.txt&quot;) → 排序 → file.name：note.txt</text></g></svg>