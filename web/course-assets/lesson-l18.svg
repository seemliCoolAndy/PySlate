<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title description"><title id="title">索引从 0 开始，显示编号可以从 1 开始</title><desc id="description">把同一三项列表的正索引、负索引与enumerate显示编号逐列对应；正索引0,1,2对应Python数学写作；负索引-3,-2,-1对应同样三项；enumerate起点1产生显示编号1,2,3，不修改索引</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#3a745c"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#e6bf83"/></marker></defs><rect width="760" height="570" rx="18" fill="#f7f8f4"/><text x="30" y="45" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="start" font-weight="600">索引从 0 开始，显示编号可以从 1 开始</text><text x="30" y="83" fill="#647a6b" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">subjects = [&quot;Python&quot;, &quot;数学&quot;, &quot;写作&quot;]</text><text x="35" y="125" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">列表索引</text><text x="35" y="310" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">负索引</text><text x="35" y="430" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="start">显示编号</text><text x="255" y="125" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">0</text><rect x="175" y="155" width="160" height="75" rx="12" fill="#e6bf83" stroke="#b6cbb3" stroke-width="2"/><text x="255.0" y="200.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">Python</text><text x="255" y="310" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">-3</text><rect x="175" y="385" width="160" height="65" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="255.0" y="425.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">1</text><text x="440" y="125" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">1</text><rect x="360" y="155" width="160" height="75" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="440.0" y="200.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">数学</text><text x="440" y="310" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">-2</text><rect x="360" y="385" width="160" height="65" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="440.0" y="425.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">2</text><text x="625" y="125" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">2</text><rect x="545" y="155" width="160" height="75" rx="12" fill="#e2ecdf" stroke="#b6cbb3" stroke-width="2"/><text x="625.0" y="200.5" fill="#253d32" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">写作</text><text x="625" y="310" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">-1</text><rect x="545" y="385" width="160" height="65" rx="12" fill="#fffdf8" stroke="#b6cbb3" stroke-width="2"/><text x="625.0" y="425.5" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="26" text-anchor="middle">3</text><text x="380" y="490" fill="#647a6b" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">enumerate(..., start=1) 只改变显示编号。</text><text x="380" y="540" fill="#253d32" font-family="Consolas,Microsoft YaHei,monospace" font-size="22" text-anchor="middle">subjects[0] → Python；subjects[-1] → 写作</text></svg>