<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">日期与金额：让类型表达规则</title><desc id="desc">日期用 date；十进制金额从字符串构造 Decimal。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a745c"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="760" height="580" rx="18" fill="#f7f8f4"/><text x="32" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#253d32">日期与金额：让类型表达规则</text><text x="32" y="88" font-size="24" font-weight="400" text-anchor="start" fill="#597060">日期用 date；十进制金额从字符串构造 Decimal。</text><text x="40" y="145" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">日期差量</text><rect x="40" y="170" width="247" height="80" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="163.5" y="219.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">2026-10-20</text><rect x="473" y="170" width="247" height="80" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="596.5" y="219.57" font-size="29" font-weight="400" text-anchor="middle" fill="#253d32">2026-10-27</text><path d="M300 210L460 210" fill="none" stroke="#3a745c" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="285" font-size="28" font-weight="400" text-anchor="middle" fill="#253d32">+ 7 天</text><text x="40" y="348" font-size="28" font-weight="600" text-anchor="start" fill="#253d32">精确十进制</text><rect x="40" y="380" width="215" height="80" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="147.5" y="428.58" font-size="26" font-weight="400" text-anchor="middle" fill="#253d32">Decimal(&quot;0.10&quot;)</text><text x="280" y="429" font-size="32" font-weight="400" text-anchor="middle" fill="#253d32">+</text><rect x="305" y="380" width="215" height="80" rx="14" fill="#e6bf83" stroke="#a9c0ac" stroke-width="2"/><text x="412.5" y="428.58" font-size="26" font-weight="400" text-anchor="middle" fill="#253d32">Decimal(&quot;0.20&quot;)</text><text x="547" y="429" font-size="32" font-weight="400" text-anchor="middle" fill="#253d32">=</text><rect x="575" y="380" width="145" height="80" rx="14" fill="#e2ecdf" stroke="#a9c0ac" stroke-width="2"/><text x="647.5" y="431.22" font-size="34" font-weight="400" text-anchor="middle" fill="#253d32">0.30</text><text x="380" y="514" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">quantize(Decimal(&quot;0.01&quot;)) 明确两位小数。</text><text x="380" y="556" font-size="24" font-weight="400" text-anchor="middle" fill="#253d32">先写成浮点数 0.1，会先引入二进制浮点近似。</text></g></svg>